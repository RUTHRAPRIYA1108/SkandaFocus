<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkandaFocus- Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Extra styling just for the landing page */
    body {
      background: linear-gradient(135deg, #fadbff, #82eb87);
      color: #100101;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      animation: slideDown 1.5s ease;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      max-width: 500px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
    }

    .btn-group a button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #e89cef;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-group a button:hover {
      background: #eb72df;
      color: #fff;
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <img src="logo.jpeg" alt="SkandaFocus Logo" class="logo">
    <h1>Welcome to SkandaFocus</h1>
    <p>
      A web-based study timer with reward-based entertainment system. 
      Stay focused, take healthy breaks, and track your progress with ease.
    </p>
    <div class="btn-group">
      <a href="login.html"><button>Login</button></a>
      <a href="register.html"><button>Register</button></a>
      <a href="timer.html"><button>Start Studying</button></a>
    </div>
  </div>

  
</body>
</html>
